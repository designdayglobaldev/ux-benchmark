name: Sync Vector Embeddings

on:
  schedule:
    # Runs daily at 02:00 UTC (nightly incremental indexing)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      sync_limit:
        description: 'Number of screens to process (enter "ALL" or "0" for all screens in database, or a number)'
        required: true
        default: 'ALL'
        type: string

jobs:
  sync-vectors:
    name: Sync Screen & App Vectors
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max (GitHub Actions maximum job limit)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Vector Pipeline Sync
        run: pnpm --filter api exec tsx src/scripts/sync-vector-embeddings.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SYNC_LIMIT: ${{ github.event.inputs.sync_limit || 'ALL' }}

      - name: Run Health & Retrieval Verification
        run: pnpm --filter api exec tsx src/scripts/verify-vector-health.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}


